name: Copy To Rclone on Mac

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      Url:
        description: 'Download Url'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: write

env:
  FILE_PATH: downloads

jobs:
  build:
    runs-on: macos-latest
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /System/Volumes/Data/Library/Developer/CoreSimulator/Images/*.dmg || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Check dependencies
        run: |
          python --version
          pip --version
          rclone version

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_ENV_FILE" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_ENV_FILE: ${{ secrets.RCLONE_CONF }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Downloading
        id: downloading
        run: |
          mkdir -p downloads

          set +e
          python task.py --opt="query" --con="${{ secrets.DB_CONNECT }}"
          download_status=$?
          set -e

          filename=$(python - <<'PY'
from pathlib import Path
files = sorted(
    p.name for p in Path('downloads').iterdir()
    if p.is_file() and not p.name.startswith('.') and not p.name.endswith('.part')
)
print(files[0] if files else "")
PY
)

          if [ -z "$filename" ]; then
            echo "No file downloaded in this run."
            {
              echo "path="
              echo "filename="
              echo "folder="
              echo "size="
              echo "download_status=$download_status"
            } >> "$GITHUB_OUTPUT"

            if [ "$download_status" -ne 0 ]; then
              exit "$download_status"
            fi
            exit 0
          fi

          folder=$(sh folder.sh "$filename")
          filesize=$(python - <<PY
from pathlib import Path
print((Path("downloads") / "$filename").stat().st_size)
PY
)

          {
            echo "path=downloads/$filename"
            echo "filename=$filename"
            echo "folder=$folder"
            echo "size=$filesize"
            echo "download_status=$download_status"
          } >> "$GITHUB_OUTPUT"

          echo "Downloaded: $filename"
          echo "Size: $filesize"

          if [ "$download_status" -ne 0 ]; then
            exit "$download_status"
          fi

      - name: Rclone copy
        if: steps.downloading.outputs.filename != ''
        run: |
          rclone copy \
            "${{ steps.downloading.outputs.path }}" \
            "SPVR:/${{ steps.downloading.outputs.folder }}" \
            --progress \
            --stats 1s \
            --verbose

      - name: Requeue task when upload failed
        if: failure() && steps.downloading.outputs.filename != ''
        run: |
          python task.py --opt="requeue" --con="${{ secrets.DB_CONNECT }}" --name="${{ steps.downloading.outputs.filename }}"

      - name: Save data
        id: database
        if: success() && steps.downloading.outputs.filename != ''
        run: |
          python task.py --opt="delete" --con="${{ secrets.DB_CONNECT }}" --name="${{ steps.downloading.outputs.filename }}"
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Dispatch next run
        if: success() && steps.downloading.outputs.filename != ''
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/Mac-Rclone.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}","inputs":{}}'

      - name: Notify upload result
        if: success() && steps.downloading.outputs.filename != ''
        run: |
          curl -fsS -o /dev/null \
            "${{ secrets.BARK_KEY }}?title=上传结果&icon=https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png&group=Actions&body=${{ steps.downloading.outputs.filename }}上传成功&isArchive=0" || true

      - name: Notify failure
        if: failure() && steps.downloading.outputs.filename != ''
        run: |
          curl -fsS -o /dev/null \
            "${{ secrets.BARK_KEY }}?title=上传结果&icon=https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png&group=Actions&body=${{ steps.downloading.outputs.filename }}失败并已回队&isArchive=0" || true
