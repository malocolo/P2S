name: Copy To Rclone on Linux

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      Url:
        description: 'Download Url'
        required: false
        default: 'false'

env:
  FILE_PATH: 'downloads'

jobs:
  build:
    runs-on: ubuntu-latest

    # Only run when the repository owner triggers it
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          persist-credentials: false
          fetch-depth: 0

      # === 🟢 核心修改：开启 Cloudflare WARP (解决 IP 403 封锁) ===
      - name: Set up Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: ipv4 # 强制 IPv4，兼容性最好
      # =========================================================

      - name: Increase available space (clean APT cache)
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            unzip \
            nodejs \
            postgresql
          # 已移除 aria2 安装步骤，不再需要

      - name: Rclone Install
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Check dependencies
        run: |
          rclone -V
          node -v
          python3 -V
          # 已移除 aria2c -v 检查

      - name: Set up Python 3.9
        uses: actions/setup-python@v2
        with:
          python-version: 3.9

      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_ENV_FILE" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_ENV_FILE: ${{ secrets.RCLONE_CONF }}

      - name: Install Python prerequisites
        run: |
          python -m pip install --upgrade pip wheel
          # 显式添加 requests，确保 task.py 稳定运行
          pip install \
            requests \
            lk21==1.5.61 \
            pymongo \
            pymongo[srv] \
            pymongo[tls] \
            certifi \
            SQLAlchemy \
            psycopg2-binary

      - name: Downloading
        id: downloading
        run: |
          mkdir -p downloads
          
          # 运行 Python 全能下载脚本 (task.py)
          # 注意：此时网络流量已通过 WARP 转发，IP 不再是 Azure 数据中心
          python task.py --opt="query" --con="${{ secrets.DB_CONNECT }}"
          
          # 验证下载结果
          filename=$(ls downloads | head -n1)
          
          # 安全检查：如果目录为空，说明下载失败，直接报错退出
          if [ -z "$filename" ]; then
            echo "Error: 下载失败，downloads 目录为空。"
            exit 1
          fi
          
          folder=$(sh folder.sh "$filename")
          
          # 输出变量 (使用新版 GITHUB_OUTPUT 语法)
          echo "path=downloads/$filename" >> $GITHUB_OUTPUT
          echo "filename=$filename" >> $GITHUB_OUTPUT
          echo "folder=$folder" >> $GITHUB_OUTPUT
          
          size=$(stat -c%s "downloads/$filename")
          echo "size=$size" >> $GITHUB_OUTPUT

      - name: Rclone copy
        if: steps.downloading.outputs.filename != '' && !cancelled() && !failure()
        run: |
          rclone copy \
            "${{ steps.downloading.outputs.path }}" \
            SPVR:/"${{ steps.downloading.outputs.folder }}" \
            --progress \
            --stats 1s \
            --verbose

      - name: Save data
        id: database
        if: steps.downloading.outputs.filename != '' && !cancelled() && !failure()
        run: |
          python task.py --opt="delete" --con="${{ secrets.DB_CONNECT }}" --name="${{ steps.downloading.outputs.filename }}"
          echo "status=ok" >> $GITHUB_OUTPUT

      - name: Dispatch next run
        if: steps.downloading.outputs.filename != '' && !cancelled() && !failure()
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ykxVK8yL5L/pikpak2cloud/actions/workflows/Linux-Rclone.yml/dispatches \
            -d '{"ref":"main","inputs":{}}'

      - name: Notify upload result
        if: steps.downloading.outputs.filename != '' && !cancelled() && !failure()
        run: |
          wget -O /dev/null -o /dev/null \
            "${{ secrets.BARK_KEY }}?title=上传结果&icon=https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png&group=Actions&body=${{ steps.downloading.outputs.filename }}上传成功&isArchive=0"

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v1.2.3
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
